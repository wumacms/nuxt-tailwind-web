name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许同一个部署并发排队，避免并发部署冲突
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate Base URL
        id: base-url
        run: |
          if [ -n "${{ vars.NUXT_APP_BASE_URL }}" ]; then
            echo "base_url=${{ vars.NUXT_APP_BASE_URL }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "base_url=/" >> $GITHUB_OUTPUT
          else
            echo "base_url=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          fi

      - name: Build and Generate Static Site
        env:
          NUXT_APP_BASE_URL: ${{ steps.base-url.outputs.base_url }}
        run: pnpm generate

      - name: Ensure .nojekyll exists
        run: touch .output/public/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
